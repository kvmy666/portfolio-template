name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changed.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect relevant changes
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s\n' "$changed" | grep -Eq '^(src/|content/|public/|tests/|scripts/|package(-lock)?\.json|next\.config|playwright\.config|postcss\.config|tsconfig|eslint\.config|lighthouserc\.js|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium-webkit
          restore-keys: |
            playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium-webkit
            playwright-${{ runner.os }}-
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run size
      - name: Functional and accessibility tests
        run: npx playwright test --project=chromium-desktop --project=webkit-mobile --grep-invert @fps --workers=2 --reporter=list,html
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
      - name: Frame budget tests
        run: npx playwright test --project=chromium-desktop --grep @fps --workers=1
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
      - name: Lighthouse
        run: npm run lighthouse
        env:
          # 3-run median; a single Lighthouse run is too noisy for a blocking gate.
          LHCI_NUMBER_OF_RUNS: "3"
      - name: Upload test artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results
            playwright-report
            .lighthouseci
          retention-days: 7
          if-no-files-found: ignore
