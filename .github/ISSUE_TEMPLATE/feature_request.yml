name: Feature request
description: Suggest a reusable improvement to the template
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is a reusable template. Features should work for any
        user, not only one portfolio. Do not include personal data or secrets.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
      placeholder: Users cannot reorder features inside a project card.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior and the content or config shape it needs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup wizard or content schema
        - Rendering or interactions
        - Locales or RTL
        - CV or contact form
        - Metrics
        - SEO or metadata
        - Accessibility
        - Performance or budgets
        - Documentation
        - CI or deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Template-wide impact
      description: Who benefits, and does it change the config schema or budgets?
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: This request is reusable across portfolios, not personal branding.
          required: true
        - label: I removed personal data and secrets from this request.
          required: true
